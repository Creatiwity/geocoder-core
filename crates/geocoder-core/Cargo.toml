[package]
name = "geocoder-core"
version.workspace = true
edition.workspace = true
description = "Address geocoding and autocomplete ported from addok, with country profiles for France (BAN), Luxembourg and Belgium"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/geocoder-core"
keywords = ["geocoding", "addok", "address", "autocomplete", "ban"]
categories = ["science::geo", "text-processing"]

[features]
default = ["cli"]
# The geocoder-build / geocoder-search binaries (downloads over HTTP).
cli = ["dep:ureq"]

[[bin]]
name = "geocoder-build"
path = "src/bin/build.rs"
required-features = ["cli"]

[[bin]]
name = "geocoder-search"
path = "src/bin/search.rs"
required-features = ["cli"]

[dependencies]
fst = "0.4"
roaring = "0.12"
memmap2 = "0.9"
unidecode = "0.3"
geohash = "0.13"
serde = { version = "1.0", features = ["derive"] }
# preserve_order: addok relies on document key order (e.g. two housenumbers
# "11b" and "11bis" folding to the same key: the last one wins).
serde_json = { version = "1.0", features = ["preserve_order"] }
flate2 = "1.1"
regex = "1.13"
fancy-regex = "0.20"
once_cell = "1.21"
thiserror = "2.0"
byteorder = "1.5"
csv = "1.4"
zip = { version = "9.6", default-features = false, features = ["deflate"] }

ureq = { version = "3.5", optional = true }

[dev-dependencies]
tempfile = "3.27"
