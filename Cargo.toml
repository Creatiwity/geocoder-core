[package]
name = "geocoder-core"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "geocoder-build"
path = "src/bin/build.rs"

[[bin]]
name = "geocoder-search"
path = "src/bin/search.rs"

[dependencies]
fst = { version = "0.4", features = ["levenshtein"] }
roaring = "0.11"
memmap2 = "0.9"
unidecode = "0.3"
geohash = "0.13"
serde = { version = "1.0", features = ["derive"] }
# preserve_order: addok relies on document key order (e.g. two housenumbers
# "11b" and "11bis" folding to the same key: the last one wins).
serde_json = { version = "1.0", features = ["preserve_order"] }
flate2 = "1.1"
regex = "1.12"
fancy-regex = "0.13"
once_cell = "1.21"
thiserror = "2.0"
byteorder = "1.5"

ureq = "2"

[dev-dependencies]
tempfile = "3.27"
