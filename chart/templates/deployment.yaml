apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolls the pods when the Sentry DSN changes.
        checksum/secret: {{ .Values.sentryDsn | toString | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "app.serviceAccountName" . }}
      # Must exceed shutdownDelaySeconds plus the longest request to drain.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- include "app.podCommon" (dict "root" .) | nindent 6 }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        {{- $constraint := deepCopy . }}
        {{- if not (hasKey $constraint "labelSelector") }}
        {{- $_ := set $constraint "labelSelector" (dict "matchLabels" (include "app.selectorLabels" $ | fromYaml)) }}
        {{- end }}
        {{- list $constraint | toYaml | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          {{- include "app.envFrom" . | nindent 10 }}
          env:
            - name: "GEOCODER_RELOAD_INTERVAL_SECONDS"
              value: "{{ .Values.reloadIntervalSeconds }}"
            - name: "SHUTDOWN_DELAY_SECONDS"
              value: "{{ .Values.shutdownDelaySeconds }}"
            {{- include "app.env" . | nindent 12 }}
          # The indexes are only read here; the update jobs rebuild them in
          # place (atomic rename), the API reloads them.
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
              readOnly: true
          # Opening the indexes (FR: ~2.7 GB mapped, its FSTs copied in memory
          # and their checksums verified) happens before the listener opens.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          # Not shutting down, and an index loaded once one is built.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        {{- include "app.dataVolume" . | nindent 8 }}
