{{/* Sensitive values, only the keys that are set. */}}
{{- if and (not .Values.secrets.existingSecret) .Values.sentryDsn -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.secrets.keys.sentryDsn }}: {{ .Values.sentryDsn | toString | b64enc | quote }}
{{- end }}
